<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ship in Clouds</title>
    <style>
      body, html { 
        margin: 0; 
        padding: 0; 
        overflow: hidden; 
        height: 100%; 
        width: 100%; 
        background: #000; 
      }
      #canvas { 
        display: block; 
        width: 100%; 
        height: 100%; 
      }
      
      /* Optional back button */
      #back-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 10;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border: 2px solid white;
        padding: 10px 20px;
        font-family: sans-serif;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px;
        transition: 0.2s;
      }
      #back-btn:hover {
        background: rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <button id="back-btn" onclick="window.location.href='/'">← Back to Island</button>
    <canvas id="canvas"></canvas>
    <script type="module" src="src/js/ship.js"></script>
  </body>
</html>
